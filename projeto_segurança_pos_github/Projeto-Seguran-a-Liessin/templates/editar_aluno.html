<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Aluno — Liessin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  {% include '_sidebar.html' %}
  <main class="main">
    <div class="topbar">
      <a href="/cadastro_aluno" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </a>
    </div>
    <div class="page-wrap">
      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header">
          <div class="card-icon">✏️</div>
          <div>
            <div class="card-title">Editar Aluno</div>
            <div class="card-subtitle">Altere as informações do aluno</div>
          </div>
        </div>

        <form method="post">
          <div class="form-group">
            <label class="form-label">Nome Completo <span>*</span></label>
            <input class="form-input" type="text" name="nome" value="{{ aluno[1] }}" required>
          </div>

          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Série <span>*</span></label>
              <select class="form-select" name="serie" required>
                <option value="">Selecione...</option>
                {% for s in series %}
                  <option value="{{ s }}" {% if s == aluno[3] %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Turma <span>*</span></label>
              <input class="form-input" type="text" name="turma" value="{{ aluno[2] }}" required>
            </div>
          </div>

          <div class="responsaveis-section">
            <div class="responsaveis-title">Responsáveis <span style="font-weight:400; color:#6b7280;">(opcional)</span></div>
            <div class="form-group">
              <label class="form-label">Nomes dos Responsáveis</label>
              <textarea class="form-input" name="responsaveis" rows="2">{{ aluno[9] or '' }}</textarea>
            </div>
          </div>

          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Telefone do Responsável</label>
              <input class="form-input" type="text" name="telefone" value="{{ aluno[11] or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">E-mail do Responsável</label>
              <input class="form-input" type="email" name="email_responsavel" value="{{ aluno[12] or '' }}">
            </div>
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Data de Nascimento</label>
              <input class="form-input" type="date" name="data_nascimento" value="{{ aluno[13] or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Alergias / Condições</label>
              <input class="form-input" type="text" name="alergias" value="{{ aluno[14] or '' }}">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Observações Gerais</label>
            <textarea class="form-input" name="observacoes" rows="2">{{ aluno[15] or '' }}</textarea>
          </div>

          <div class="horarios-section">
            <div class="horarios-title">Horários de Saída Padrão</div>
            <div class="form-row form-row-5">
              <div class="form-group"><label>Segunda</label><input class="form-input" type="time" name="saida_seg" value="{{ aluno[4] or '' }}"></div>
              <div class="form-group"><label>Terça</label><input class="form-input" type="time" name="saida_ter" value="{{ aluno[5] or '' }}"></div>
              <div class="form-group"><label>Quarta</label><input class="form-input" type="time" name="saida_qua" value="{{ aluno[6] or '' }}"></div>
              <div class="form-group"><label>Quinta</label><input class="form-input" type="time" name="saida_qui" value="{{ aluno[7] or '' }}"></div>
              <div class="form-group"><label>Sexta</label><input class="form-input" type="time" name="saida_sex" value="{{ aluno[8] or '' }}"></div>
            </div>
          </div>

          <div class="btn-actions">
            <button class="btn btn-primary" type="submit">Salvar Alterações</button>
            <a href="/cadastro_aluno" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
