# nginx do SecureEdu.
#
# Instalação:
#   sudo cp deploy/nginx-secureedu.conf /etc/nginx/sites-available/secureedu
#   sudo ln -s /etc/nginx/sites-available/secureedu /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Trocar SEU_DOMINIO pelo domínio real ANTES de instalar.
#
# Este arquivo começa como HTTP válido para o desafio ACME. Depois de o DNS apontar
# para o VPS, rode:
#   sudo certbot --nginx --redirect -d SEU_DOMINIO -d www.SEU_DOMINIO
# O certbot acrescenta o bloco TLS, os certificados e o redirecionamento 80 -> 443.

# Limite de requisições na camada do nginx, antes de a app gastar um worker com PBKDF2.
#
# NÃO substitui o rate limit de app/core/rate_limit.py — aquele é por conta e fica no
# banco (sobrevive a restart, vale para os dois workers) e é o que protege de fato
# contra força bruta em uma conta específica. Este aqui é o freio grosso, contra um
# volume de requisições que derrubaria o servidor antes de chegar nessa lógica.
limit_req_zone $binary_remote_addr zone=secureedu_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=secureedu_geral:10m rate=120r/m;

upstream secureedu_app {
    # Onde o gunicorn escuta (deploy/gunicorn.conf.py).
    server 127.0.0.1:8002 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;

    # As diretivas listen 443/ssl_certificate são inseridas pelo certbot após a
    # validação do domínio. Até lá, FORCE_HTTPS=true faz a aplicação redirecionar
    # usuários; o próprio certbot serve /.well-known/acme-challenge/ no nginx.

    # Não anuncia a versão do nginx nas páginas de erro e no cabeçalho Server.
    server_tokens off;

    # Casa com MAX_CONTENT_LENGTH (16MB) da aplicação. Se ficar menor, o nginx corta o
    # upload com 413 antes de a app poder responder com a mensagem própria; se ficar
    # muito maior, aceita banda à toa para a app rejeitar depois.
    client_max_body_size 16m;
    client_body_timeout 60s;

    # Menor que o `keepalive` do gunicorn (75s), de propósito: quem fecha a conexão
    # ociosa é sempre o nginx, evitando a corrida em que o gunicorn fecha no exato
    # momento em que o nginx reaproveita a conexão (vira 502 esporádico).
    keepalive_timeout 65s;

    access_log /var/log/nginx/secureedu.access.log;
    error_log  /var/log/nginx/secureedu.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Arquivos estáticos direto do disco: não gastam worker do gunicorn.
    # A app também tem rotas próprias para /static/css/style.css e /static/images/
    # (app/api/web.py:127-134), mas o nginx intercepta antes. O conteúdo é o mesmo.
    location /static/ {
        alias /opt/secureedu/S2E_postgreSQL/s2e-api/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Rotas de autenticação: freio mais apertado. São as que verificam senha (PBKDF2,
    # caro de propósito), consomem código 2FA ou disparam e-mail.
    # A regex tem prioridade sobre o "location /" abaixo, então basta declará-la.
    location ~ ^/(esqueci_senha|resetar_senha/|pais/(login|cadastro|verificar|esqueci_senha|resetar_senha/)) {
        limit_req zone=secureedu_login burst=10 nodelay;
        include /etc/nginx/snippets/secureedu-proxy.conf;
    }

    # A tela de login da equipe é a própria raiz (app/api/web.py:138, GET e POST).
    location = / {
        limit_req zone=secureedu_login burst=10 nodelay;
        include /etc/nginx/snippets/secureedu-proxy.conf;
    }

    location / {
        limit_req zone=secureedu_geral burst=40 nodelay;
        include /etc/nginx/snippets/secureedu-proxy.conf;
    }
}
