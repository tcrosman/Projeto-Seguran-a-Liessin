# Cabeçalhos do proxy reverso para o gunicorn.
#
# Instalação:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx-secureedu-proxy.conf /etc/nginx/snippets/secureedu-proxy.conf
#
# Está num arquivo à parte porque é incluído em três `location` do server block, e
# um cabeçalho esquecido em um deles seria difícil de perceber: a app continuaria
# respondendo, só que enxergando o IP errado naquela rota específica.

proxy_pass http://secureedu_app;

# --- os dois cabeçalhos de que a aplicação depende ---
#
# app/__init__.py:35 aplica ProxyFix(x_for=1, x_proto=1) quando TRUST_PROXY=true.
#
# X-Forwarded-For  -> vira request.remote_addr. Sem ele, o rate limit por IP de
#                     app/core/rate_limit.py contaria todo mundo como 127.0.0.1:
#                     ou seja, um único visitante trancaria a escola inteira.
# X-Forwarded-Proto-> diz ao Flask-Talisman que a request chegou por HTTPS. Sem ele,
#                     com FORCE_HTTPS=true, o Talisman redireciona para https, o
#                     nginx repassa em http, e o navegador entra em loop de redirect.
#
# $proxy_add_x_forwarded_for e não $remote_addr: preserva a cadeia se um dia houver
# um CDN à frente. x_for=1 na app significa "confie no ÚLTIMO salto", que é este
# nginx — o valor que ele acrescenta. Se um CDN entrar na frente, x_for precisa
# virar 2, senão o cliente pode forjar o próprio IP.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

# Nada aqui usa X-Forwarded-Host: ProxyFix é criado com x_host omitido de propósito
# (os links de e-mail vêm de BASE_URL), então este cabeçalho é deliberadamente
# limpo para não haver como envenenar o destino de um redirect.
proxy_set_header X-Forwarded-Host "";

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_redirect off;
proxy_buffering on;

# Um pouco menor que o timeout do gunicorn (120s), para o nginx devolver 504 com
# página própria em vez de esperar o worker ser morto.
proxy_connect_timeout 10s;
proxy_send_timeout 110s;
proxy_read_timeout 110s;
