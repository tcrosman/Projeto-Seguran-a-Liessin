services:
  - type: web
    name: secureedu
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: UPLOAD_FOLDER
        value: storage
      # Render põe um proxy na frente: sem isso, o rate limit veria o IP do proxy para todos.
      - key: TRUST_PROXY
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      # Origem dos dados de aluno. Sem estas variáveis o app se recusa a subir, de propósito:
      # antes o padrão silencioso era o mock, e um deploy sem elas servia três alunos de teste
      # como se fossem o cadastro da escola.
      #   false -> banco SQL da instituição (exige ENGINE e DATABASE abaixo)
      #   true  -> três alunos fixos, só para desenvolvimento
      - key: SCHOOL_SQL_MOCK
        value: "false"
      - key: SCHOOL_SQL_ENGINE
        value: postgres
      - key: SCHOOL_SQL_DATABASE
        sync: false
      - key: SCHOOL_SQL_HOST
        sync: false
      - key: SCHOOL_SQL_PORT
        sync: false
      - key: SCHOOL_SQL_USER
        sync: false
      - key: SCHOOL_SQL_PASSWORD
        sync: false
      # Fuso da escola: o servidor e o Postgres rodam em UTC, mas portaria e pais usam o
      # relógio de Brasília.
      - key: TIMEZONE
        value: America/Sao_Paulo
