services:
  - type: web
    name: secureedu
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: UPLOAD_FOLDER
        value: storage
      # Render põe um proxy na frente: sem isso, o rate limit veria o IP do proxy para todos.
      - key: TRUST_PROXY
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
