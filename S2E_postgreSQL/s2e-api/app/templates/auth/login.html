<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:28px; display:flex; justify-content:center;">
      <div style="overflow:hidden; width:240px; height:69px;">
        <img src="/static/images/logo-dark.png" alt="SecureEdu" style="width:374px; height:auto; margin-top:-140px; margin-left:-69px;">
      </div>
    </div>

    <h1 class="login-title">Bem-vindo</h1>
    <p class="login-sub">Sistema de Controle de Saídas</p>

    {% if request.args.get('resetado') %}
      <div class="alert alert-success">Senha redefinida com sucesso!</div>
    {% endif %}
    {% if erro %}
      <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input class="form-input" name="u" placeholder="Digite seu usuário" value="{{ usuario or '' }}" required autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" name="s" type="password" placeholder="Digite sua senha" required autocomplete="current-password">
        <a href="/esqueci_senha" class="login-forgot">Esqueci minha senha</a>
      </div>
      <button class="btn btn-primary btn-full" type="submit">Entrar</button>
    </form>

    <hr style="border:none; border-top:1px solid #f3f4f6; margin:24px 0 20px;">
    <div style="text-align:center;">
      <p style="font-size:13px; color:#6b7280; margin-bottom:10px;">É pai ou responsável de um aluno?</p>
      <a href="/pais" class="btn btn-secondary btn-full" style="display:block;">
        Acessar Portal dos Responsáveis
      </a>
    </div>
  </div>
</div>
</body>
</html>
