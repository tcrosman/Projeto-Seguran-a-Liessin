<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:28px; display:flex; justify-content:center;">
      <div style="overflow:hidden; width:240px; height:69px;">
        <img src="/static/images/logo-dark.png" alt="SecureEdu" style="width:374px; height:auto; margin-top:-140px; margin-left:-69px;">
      </div>
    </div>

    <h1 class="login-title">Nova senha</h1>
    <p class="login-sub">Digite e confirme sua nova senha</p>

    {% if erro %}
      <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    {% if token %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input class="form-input" type="password" name="senha" placeholder="8+ caracteres, com maiúscula, número e símbolo" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <input class="form-input" type="password" name="confirma" placeholder="Repita a senha" required minlength="8">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Redefinir senha</button>
      </form>
    {% else %}
      <a href="/esqueci_senha" class="btn btn-primary btn-full">Solicitar novo link</a>
    {% endif %}

    <div style="text-align: center; margin-top: 16px;">
      <a href="/colaboradores" class="login-forgot">← Voltar ao login</a>
    </div>
  </div>
</div>
</body>
</html>
