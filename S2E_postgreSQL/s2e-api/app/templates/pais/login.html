<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal dos Responsáveis — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:28px; display:flex; justify-content:center;">
      <div style="overflow:hidden; width:240px; height:69px;">
        <img src="/static/images/logo-dark.png" alt="SecureEdu" style="width:374px; height:auto; margin-top:-140px; margin-left:-69px;">
      </div>
    </div>
    <div style="text-align:center; margin-bottom:28px;">
      <h1 style="font-size:20px; font-weight:700; color:#111827; margin-bottom:4px;">Portal dos Responsáveis</h1>
      <p style="font-size:13px; color:#6b7280;">Acesse para solicitar saídas antecipadas</p>
    </div>

    {% if request.args.get('resetado') %}
      <div class="alert alert-success" style="margin-bottom:16px;">Senha redefinida com sucesso. Faça o login.</div>
    {% endif %}

    {% if erro %}
      <div class="alert alert-error" style="margin-bottom:16px;">{{ erro }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" name="email" required autofocus
               placeholder="seu@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input class="form-input" type="password" name="senha" required
               placeholder="Sua senha" autocomplete="current-password">
      </div>

      <button class="btn btn-primary btn-full" type="submit" id="btn-entrar" style="margin-top:8px;">Entrar</button>
    </form>
    <script>
      document.querySelector('form').addEventListener('submit', function() {
        const btn = document.getElementById('btn-entrar');
        btn.disabled = true;
        btn.textContent = 'Entrando...';
      });
    </script>

    <p style="text-align:center; margin-top:12px; font-size:13px;">
      <a href="/pais/esqueci_senha" style="color:#2563eb;">Esqueceu a senha?</a>
    </p>

    <p style="text-align:center; margin-top:8px; font-size:13px; color:#6b7280;">
      Não tem conta? <a href="/pais/cadastro" style="color:#2563eb; font-weight:600;">Cadastre-se</a>
    </p>

    <hr style="border:none; border-top:1px solid #f3f4f6; margin:20px 0;">
    <p style="text-align:center; font-size:12px; color:#9ca3af;">
      É funcionário da escola? <a href="/" style="color:#6b7280;">Acesso de funcionários →</a>
    </p>
  </div>
</div>
</body>
</html>
