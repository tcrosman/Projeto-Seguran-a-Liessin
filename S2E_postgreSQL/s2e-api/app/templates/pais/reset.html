<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova senha — SecureEdu</title>
  <link rel="stylesheet" href="{{ estatico('css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:28px; display:flex; justify-content:center;">
      <div style="overflow:hidden; width:240px; height:69px;">
        <img src="{{ estatico('images/logo-dark.png') }}" alt="SecureEdu" style="width:374px; height:auto; margin-top:-140px; margin-left:-69px;">
      </div>
    </div>
    <div style="text-align:center; margin-bottom:28px;">
      <h1 style="font-size:20px; font-weight:700; color:#111827; margin-bottom:4px;">Criar nova senha</h1>
      <p style="font-size:13px; color:#6b7280;">Escolha uma senha segura: 8+ caracteres, com maiúscula, número e símbolo</p>
    </div>

    {% if erro %}
      <div class="alert alert-error" style="margin-bottom:16px;">{{ erro }}</div>
    {% endif %}

    {% if token %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input class="form-input" type="password" name="senha" required autofocus
                 placeholder="8+ caracteres, com maiúscula, número e símbolo" autocomplete="new-password" minlength="8">
        </div>

        <div class="form-group">
          <label class="form-label">Confirmar nova senha</label>
          <input class="form-input" type="password" name="confirma" required
                 placeholder="Repita a senha" autocomplete="new-password" minlength="8">
        </div>

        <button class="btn btn-primary btn-full" type="submit" style="margin-top:8px;">Salvar nova senha</button>
      </form>
    {% else %}
      <p style="text-align:center; font-size:14px; color:#6b7280; margin-top:8px;">
        Este link já foi utilizado ou expirou.
        <a href="/pais/esqueci_senha" style="color:#2563eb; font-weight:600;">Solicitar um novo</a>
      </p>
    {% endif %}

    <p style="text-align:center; margin-top:20px; font-size:13px; color:#6b7280;">
      <a href="/pais/login" style="color:#6b7280;">← Voltar ao login</a>
    </p>
  </div>
</div>
</body>
</html>
