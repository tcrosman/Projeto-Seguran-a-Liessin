<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Saída — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .tipo-saida-group {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .tipo-saida-option {
      flex: 1;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .tipo-saida-option:hover { border-color: #2563eb; background: #eff6ff; }
    .tipo-saida-option input[type="radio"] { accent-color: #2563eb; width: 16px; height: 16px; }
    .tipo-saida-option.selected { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    #acompanhante-wrap { display: none; }
  </style>
</head>
<body style="background:#f9fafb; min-height:100vh;">

  <div style="background:#fff; border-bottom:1px solid #e5e7eb; padding:14px 24px; display:flex; align-items:center; justify-content:space-between;">
    <div style="overflow:hidden; width:120px; height:34px;">
      <img src="/static/images/logo-dark.png" style="width:190px; margin-left:-34px; margin-top:-5px;" alt="SecureEdu">
    </div>
    <a href="/pais/dashboard" class="btn btn-secondary" style="font-size:13px; padding:6px 14px;">← Voltar</a>
  </div>

  <div style="max-width:560px; margin:0 auto; padding:32px 20px;">
    <div class="card">
      <div class="card-header">
        <div class="card-icon">📋</div>
        <div>
          <div class="card-title">Solicitar Saída Antecipada</div>
          <div class="card-subtitle">{{ aluno.nome }} — {{ aluno.serie }} Turma {{ aluno.turma }}</div>
        </div>
      </div>

      {% if erro %}
        <div class="alert alert-error" style="margin-bottom:16px;">{{ erro }}</div>
      {% endif %}

      <div style="background:#fefce8; border:1px solid #fde68a; border-radius:10px; padding:12px 16px; margin-bottom:20px; font-size:13px; color:#92400e;">
        ⚠️ A saída só será efetivada após aprovação da escola.
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Data da saída <span>*</span></label>
            <input class="form-input" type="date" name="data_solicitada" required value="{{ today }}" min="{{ today }}">
          </div>
          <div class="form-group">
            <label class="form-label">Horário</label>
            <input class="form-input" type="time" name="horario">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Motivo <span>*</span></label>
          <input class="form-input" type="text" name="motivo" required
                 placeholder="ex: Consulta médica, compromisso familiar...">
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de saída <span>*</span></label>
          <div class="tipo-saida-group">
            <label class="tipo-saida-option" id="opt-sozinho">
              <input type="radio" name="tipo_saida" value="sozinho" required onchange="toggleAcompanhante(this)">
              🚶 Sozinho
            </label>
            <label class="tipo-saida-option" id="opt-acompanhado">
              <input type="radio" name="tipo_saida" value="acompanhado" onchange="toggleAcompanhante(this)">
              👥 Acompanhado
            </label>
          </div>
        </div>

        <div class="form-group" id="acompanhante-wrap">
          <label class="form-label">Com quem? <span>*</span></label>
          <input class="form-input" type="text" name="acompanhante" id="acompanhante-input"
                 placeholder="Nome e grau de parentesco ou relação">
        </div>

        <div class="btn-actions">
          <button class="btn btn-primary" type="submit">Enviar solicitação</button>
          <a href="/pais/dashboard" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleAcompanhante(radio) {
      const wrap = document.getElementById('acompanhante-wrap');
      const input = document.getElementById('acompanhante-input');
      const optSozinho = document.getElementById('opt-sozinho');
      const optAcomp = document.getElementById('opt-acompanhado');

      if (radio.value === 'acompanhado') {
        wrap.style.display = 'block';
        input.required = true;
        optSozinho.classList.remove('selected');
        optAcomp.classList.add('selected');
      } else {
        wrap.style.display = 'none';
        input.required = false;
        input.value = '';
        optAcomp.classList.remove('selected');
        optSozinho.classList.add('selected');
      }
    }
  </script>
</body>
</html>
