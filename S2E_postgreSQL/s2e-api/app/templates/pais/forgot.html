<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci a senha — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="margin-bottom:28px; display:flex; justify-content:center;">
      <div style="overflow:hidden; width:240px; height:69px;">
        <img src="/static/images/logo-dark.png" alt="SecureEdu" style="width:374px; height:auto; margin-top:-140px; margin-left:-69px;">
      </div>
    </div>
    <div style="text-align:center; margin-bottom:28px;">
      <h1 style="font-size:20px; font-weight:700; color:#111827; margin-bottom:4px;">Redefinir senha</h1>
      <p style="font-size:13px; color:#6b7280;">Informe seu email e enviaremos um link para criar uma nova senha</p>
    </div>

    {% if mensagem %}
      <div class="alert alert-success" style="margin-bottom:16px;">{{ mensagem }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" name="email" required autofocus
               placeholder="seu@email.com" autocomplete="email">
      </div>

      <button class="btn btn-primary btn-full" type="submit" style="margin-top:8px;">Enviar link</button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:13px; color:#6b7280;">
      Lembrou a senha? <a href="/pais/login" style="color:#2563eb; font-weight:600;">Voltar ao login</a>
    </p>
  </div>
</div>
</body>
</html>
