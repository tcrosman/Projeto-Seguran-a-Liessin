<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Aluno — SecureEdu</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  {% include 'sidebar.html' %}
  <main class="main">
    <div class="topbar">
      <a href="/cadastro_aluno" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </a>
    </div>
    <div class="page-wrap">
      <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header">
          <div class="card-icon">✏️</div>
          <div>
            <div class="card-title">Editar Aluno</div>
            <div class="card-subtitle">Altere as informações do aluno</div>
          </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=True) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}" style="margin-bottom:16px;">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label class="form-label">Nome Completo <span>*</span></label>
            <input class="form-input" type="text" name="nome" value="{{ aluno.nome }}" required>
          </div>

          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Série <span>*</span></label>
              <select class="form-select" name="serie" required>
                <option value="">Selecione...</option>
                {% for s in series %}
                  <option value="{{ s }}" {% if s == aluno.serie %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Turma <span>*</span></label>
              <input class="form-input" type="text" name="turma" value="{{ aluno.turma }}" required>
            </div>
          </div>

          <div class="responsaveis-section">
            <div class="responsaveis-title">Responsáveis <span style="font-weight:400; color:#6b7280;">(opcional)</span></div>
            <div class="form-group">
              <label class="form-label">Nomes dos Responsáveis</label>
              <textarea class="form-input" name="responsaveis" rows="2">{{ aluno.responsaveis or '' }}</textarea>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Telefone do Responsável</label>
            <input class="form-input" type="text" name="telefone" value="{{ aluno.telefone or '' }}">
          </div>
          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Data de Nascimento</label>
              <input class="form-input" type="date" name="data_nascimento" value="{{ aluno.data_nascimento or '' }}">
            </div>
            <div class="form-group">
              <label class="form-label">Alergias / Condições</label>
              <input class="form-input" type="text" name="alergias" value="{{ aluno.alergias or '' }}">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Observações Gerais</label>
            <textarea class="form-input" name="observacoes" rows="2">{{ aluno.observacoes or '' }}</textarea>
          </div>

          <div class="horarios-section">
            <div class="horarios-title">Horários de Saída Padrão</div>
            <div class="form-row form-row-5">
              <div class="form-group"><label>Segunda</label><input class="form-input" type="time" name="saida_seg" value="{{ aluno.saida_seg or '' }}"></div>
              <div class="form-group"><label>Terça</label><input class="form-input" type="time" name="saida_ter" value="{{ aluno.saida_ter or '' }}"></div>
              <div class="form-group"><label>Quarta</label><input class="form-input" type="time" name="saida_qua" value="{{ aluno.saida_qua or '' }}"></div>
              <div class="form-group"><label>Quinta</label><input class="form-input" type="time" name="saida_qui" value="{{ aluno.saida_qui or '' }}"></div>
              <div class="form-group"><label>Sexta</label><input class="form-input" type="time" name="saida_sex" value="{{ aluno.saida_sex or '' }}"></div>
            </div>
          </div>

          <div class="btn-actions">
            <button class="btn btn-primary" type="submit">Salvar Alterações</button>
            <a href="/cadastro_aluno" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
