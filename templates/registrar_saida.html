<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Saída — Liessin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  {% include '_sidebar.html' %}
  <main class="main">
    <div class="topbar">
      <a href="/cadastro_aluno" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar
      </a>
    </div>
    <div class="page-wrap">
      <div class="card" style="max-width: 640px; margin: 0 auto;">
        <div class="card-header">
          <div class="card-icon">📋</div>
          <div>
            <div class="card-title">Registrar Saída</div>
            <div class="card-subtitle">Preencha os dados da saída antecipada</div>
          </div>
        </div>

        {% if erro %}
          <div class="alert alert-error">{{ erro }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label class="form-label">Aluno <span>*</span></label>
            <select class="form-select" name="aluno_id" required>
              {% for aluno in alunos %}
                <option value="{{ aluno[0] }}" {% if aluno_selecionado == aluno[0]|string %}selected{% endif %}>
                  {{ aluno[1] }} — {{ aluno[3] }} Turma {{ aluno[2] }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-row form-row-2">
            <div class="form-group">
              <label class="form-label">Data <span>*</span></label>
              <input class="form-input" type="date" name="data_saida" value="{{ today }}" max="{{ today }}">
            </div>
            <div class="form-group">
              <label class="form-label">Horário <span>*</span></label>
              <input class="form-input" type="time" name="horario" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Motivo <span>*</span></label>
            <input class="form-input" type="text" name="motivo" required placeholder="ex: Consulta médica">
          </div>

          <div class="form-group">
            <label class="form-label">Responsável da escola <span>*</span></label>
            <input class="form-input" type="text" name="responsavel_escola" required placeholder="ex: Inspetor, Coordenador...">
          </div>

          <div class="form-group">
            <label class="form-label">Tipo de Saída <span>*</span></label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="tipo_saida" value="sozinho" required onchange="toggleAcompanhante(this)">
                <span>Sozinho(a)</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="tipo_saida" value="acompanhado" onchange="toggleAcompanhante(this)">
                <span>Acompanhado(a)</span>
              </label>
            </div>
          </div>

          <div class="form-group" id="acompanhante-group" style="display:none;">
            <label class="form-label">Com quem? <span>*</span></label>
            <input class="form-input" type="text" name="acompanhante" id="acompanhante-input" placeholder="Nome do acompanhante">
          </div>

          <div class="form-group">
            <label class="form-label">
              Documento do responsável pela retirada
              <span style="color:#6b7280; font-weight:400;">(opcional — RG, CNH, etc.)</span>
            </label>
            <div class="file-upload-wrap" onclick="document.getElementById('documento').click()">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span id="doc-label">Clique para anexar documento (PDF, JPG, PNG)</span>
            </div>
            <input type="file" id="documento" name="documento" accept=".pdf,.jpg,.jpeg,.png" style="display:none;"
              onchange="document.getElementById('doc-label').textContent = this.files[0] ? this.files[0].name : 'Clique para anexar documento (PDF, JPG, PNG)'">
          </div>

          <div class="btn-actions">
            <button class="btn btn-primary" type="submit">Registrar Saída</button>
            <a href="/cadastro_aluno" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script>
function toggleAcompanhante(radio) {
  var group = document.getElementById('acompanhante-group');
  var input = document.getElementById('acompanhante-input');
  if (radio.value === 'acompanhado') {
    group.style.display = '';
    input.required = true;
  } else {
    group.style.display = 'none';
    input.required = false;
    input.value = '';
  }
}
</script>
</body>
</html>
