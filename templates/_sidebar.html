<!-- Mobile top bar -->
<div class="mobile-topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <img src="/static/Logo_Liessin_RGB.png" alt="Liessin" style="height: 36px; width: auto; object-fit: contain; filter: brightness(10);">
</div>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo" style="justify-content: center;">
    <img src="/static/Logo_Liessin_RGB.png" alt="Liessin" style="height: 56px; width: 160px; object-fit: contain;">
  </div>

  <nav class="sidebar-nav">
    <a href="/inicio" class="sidebar-link {% if request.endpoint == 'inicio' %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
      Menu Principal
    </a>
    <a href="/cadastro_aluno" class="sidebar-link {% if request.endpoint in ['cadastro_aluno', 'registrar_saida'] %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      Alunos
    </a>
    <a href="/saidas" class="sidebar-link {% if request.endpoint == 'lista_saidas' %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 11 12 14 22 4"/></svg>
      Saídas
    </a>
    {% if session.role == 'admin' %}
<a href="/cadastro_massa" class="sidebar-link {% if request.endpoint == 'cadastro_massa' %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Cadastrar Aluno
    </a>
    <a href="/configuracoes" class="sidebar-link {% if request.endpoint in ['configuracoes', 'configurar_horarios', 'novo', 'admin_backup'] %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Configurações
    </a>
    {% endif %}
    <a href="/manual" class="sidebar-link {% if request.endpoint == 'manual' %}active{% endif %}">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Manual
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-status">
      <div class="sidebar-status-dot">Sistema Ativo</div>
      <p>Database Connected</p>
    </div>
    <a href="/logout" class="sidebar-logout">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </a>
  </div>
</aside>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
  document.querySelector('.mobile-topbar').classList.toggle('hidden');
}
</script>
