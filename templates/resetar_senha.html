<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha — Liessin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🎓</div>
      <span class="login-logo-text">Liessin</span>
    </div>

    <h1 class="login-title">Nova senha</h1>
    <p class="login-sub">Digite e confirme sua nova senha</p>

    {% if erro %}
      <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    {% if token %}
      <form method="post">
        <div class="form-group">
          <label class="form-label">Nova senha</label>
          <input class="form-input" type="password" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <input class="form-input" type="password" name="confirma" placeholder="Repita a senha" required minlength="6">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Redefinir senha</button>
      </form>
    {% else %}
      <a href="/esqueci_senha" class="btn btn-primary btn-full">Solicitar novo link</a>
    {% endif %}

    <div style="text-align: center; margin-top: 16px;">
      <a href="/" class="login-forgot">← Voltar ao login</a>
    </div>
  </div>
</div>
</body>
</html>
